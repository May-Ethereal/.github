name: reusable-security-scan

# Org-wide security scan. Call it from any repository:
#
#   jobs:
#     security:
#       uses: May-Ethereal/.github/.github/workflows/reusable-security-scan.yml@main
#
# It fails on committed secrets, tracked credential files, and high or critical
# dependency advisories in npm, Python or Rust projects.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned secret scanner
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"

      - name: Scan history and working tree for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1'

      - name: Fail on tracked credential files
        run: |
          set -euo pipefail
          tracked=$(git ls-files \
            | grep -Ei '\.(pem|key|pfx|p12|jks|keystore)$|(^|/)\.env($|\.)|(^|/)id_(rsa|dsa|ecdsa|ed25519)$' \
            | grep -Ev '(^|/)\.env\.(example|sample|template)$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::credential files are tracked in this repository:"
            echo "$tracked"
            exit 1
          fi

      - name: Audit npm dependencies
        if: ${{ hashFiles('**/package-lock.json') != '' }}
        run: |
          set -euo pipefail
          for lock in $(git ls-files 'package-lock.json' '*/package-lock.json'); do
            dir="$(dirname "$lock")"
            echo "::group::npm audit ($dir)"
            (cd "$dir" && npm audit --omit=dev --audit-level=high)
            echo "::endgroup::"
          done

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        if: ${{ hashFiles('**/uv.lock') != '' }}
        with:
          version: '0.13.7'

      - name: Audit Python dependencies
        if: ${{ hashFiles('**/uv.lock') != '' }}
        run: |
          set -euo pipefail
          for lock in $(git ls-files 'uv.lock' '*/uv.lock'); do
            dir="$(dirname "$lock")"
            echo "::group::pip-audit ($dir)"
            (cd "$dir" && uv export --locked --no-dev --no-emit-project --no-hashes \
               --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt" \
              && uvx --from 'pip-audit==2.9.0' pip-audit --strict --requirement "$RUNNER_TEMP/requirements.txt")
            echo "::endgroup::"
          done

      - name: Audit Rust dependencies
        if: ${{ hashFiles('**/Cargo.lock') != '' }}
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
